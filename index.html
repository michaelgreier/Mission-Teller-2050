<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<style>
@font-face{font-family:"Atkinson Hyperlegible";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-style:italic;font-weight:400;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-400-italic.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Bricolage Grotesque";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/bricolage-grotesque-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Bricolage Grotesque";font-style:normal;font-weight:800;font-display:swap;src:url(fonts/bricolage-grotesque-latin-800-normal.woff2) format("woff2")}
</style>
<title>Mission Teller 2050</title>
<style>
/* Layout: ein Arbeitsheft – schmale Lesespalte, oben eine Stationsleiste, jede Station eine Seite */
:root{
  --paper:#F3F5EF; --sheet:#FFFFFF; --ink:#1E3428; --ink-soft:#56685C; --rule:#D5DCD2;
  --carrot:#E2711D; --carrot-soft:#FBE6D3; --leaf:#2F7D45; --leaf-soft:#DCEEDF; --berry:#B23A48; --berry-soft:#F6DDE0;
  --focus:#1E6FD9;
  --f-display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", Verdana, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#141B17; --sheet:#1C2520; --ink:#E7EEE8; --ink-soft:#A5B4AA; --rule:#2F3B34;
  --carrot:#F28A3C; --carrot-soft:#3A2717; --leaf:#5DB874; --leaf-soft:#1E3326; --berry:#E2707E; --berry-soft:#3A1E23; --focus:#7FB2FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141B17; --sheet:#1C2520; --ink:#E7EEE8; --ink-soft:#A5B4AA; --rule:#2F3B34;
  --carrot:#F28A3C; --carrot-soft:#3A2717; --leaf:#5DB874; --leaf-soft:#1E3326; --berry:#E2707E; --berry-soft:#3A1E23; --focus:#7FB2FF; color-scheme:dark}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 64px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.15;margin:0}
h1{font-size:clamp(30px,6vw,46px);font-weight:800;letter-spacing:-.01em}
h2{font-size:clamp(24px,4.4vw,32px);font-weight:800}
h3{font-size:19px;font-weight:600}
p{margin:0}
.eyebrow{font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-soft);font-weight:700}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
header.top{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
header.top .who{color:var(--ink-soft);font-size:15px}
nav.stations{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:22px;scrollbar-width:thin}
nav.stations button{flex:0 0 auto;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:7px 13px;font:inherit;font-size:14px;cursor:pointer;display:flex;gap:6px;align-items:center}
nav.stations button[aria-current="step"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
nav.stations button .tick{width:16px;height:16px;border-radius:50%;border:1.5px solid currentColor;display:inline-grid;place-items:center;font-size:11px;line-height:1}
nav.stations button.done .tick{background:var(--leaf);border-color:var(--leaf);color:#fff}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:22px clamp(16px,4vw,30px)}
.btn{font:inherit;font-weight:700;border-radius:10px;padding:11px 18px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.small{padding:6px 12px;font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
input[type=text],textarea,select{font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--rule);border-radius:10px;padding:10px 12px;width:100%;box-sizing:border-box}
textarea{min-height:84px;resize:vertical}
label.field{display:flex;flex-direction:column;gap:6px;font-weight:700}
label.field span.hint{font-weight:400;color:var(--ink-soft);font-size:15px}
.note{border-left:4px solid var(--carrot);background:var(--carrot-soft);padding:12px 14px;border-radius:0 10px 10px 0}
.note.green{border-color:var(--leaf);background:var(--leaf-soft)}
.note.red{border-color:var(--berry);background:var(--berry-soft)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px}
.fact{border:1px solid var(--rule);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px;background:var(--paper)}
.fact b{font-family:var(--f-display);font-size:22px}
ul.clean{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}

/* Film */
.film{background:#2B2420;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.film svg{width:100%;height:auto;display:block;border-radius:8px;aspect-ratio:16/9;max-width:100%}
.film .cap{color:#FFF6E8;font-family:var(--f-display);font-weight:600;font-size:clamp(17px,2.6vw,22px);min-height:3.2em;line-height:1.3}
.film .ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.film .ctrl button{font:inherit;font-size:15px;font-weight:700;background:#FFF6E8;color:#2B2420;border:0;border-radius:8px;padding:7px 12px;cursor:pointer}
.film .ctrl label{color:#FFF6E8;font-size:15px;display:flex;gap:6px;align-items:center}
.film .dots{display:flex;gap:6px;margin-left:auto}
.film .dots span{width:9px;height:9px;border-radius:50%;background:#6B5D52}
.film .dots span.on{background:#F28A3C}

/* Fragen */
.qlist{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.qlist li{display:grid;grid-template-columns:1fr minmax(0,230px) auto;gap:10px;align-items:center;border:1px solid var(--rule);border-radius:10px;padding:10px 12px;background:var(--paper)}
.qlist li p{min-width:0;overflow-wrap:anywhere}
@media (max-width:620px){.qlist li{grid-template-columns:1fr auto}.qlist li select{grid-column:1 / -1;grid-row:2}}
.x{border:0;background:transparent;color:var(--ink-soft);font-size:22px;cursor:pointer;line-height:1;padding:2px 6px}

/* Leitfrage-Baukasten */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:16px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--carrot);border-color:var(--carrot);color:#fff}
.built{font-family:var(--f-display);font-size:clamp(20px,3.4vw,26px);font-weight:600;padding:16px;border:2px dashed var(--carrot);border-radius:12px;min-height:1.5em}
.reveal{font-family:var(--f-display);font-weight:800;font-size:clamp(22px,4vw,30px);color:var(--leaf)}

/* Quiz */
.quiz{display:flex;flex-direction:column;gap:18px;counter-reset:q}
.quiz fieldset{border:1px solid var(--rule);border-radius:12px;padding:14px 16px;margin:0;background:var(--paper)}
.quiz legend{font-weight:700;padding:0 6px}
.quiz .opts{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.quiz .opts label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;padding:4px 2px}
.quiz .opts input{margin-top:5px;accent-color:var(--carrot);width:18px;height:18px;flex:0 0 auto}
.quiz .fb{font-size:15px;margin-top:6px}
.ok{color:var(--leaf);font-weight:700}.no{color:var(--berry);font-weight:700}

/* Laufzettel */
.packs{display:flex;flex-direction:column;gap:12px}
.pack{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);overflow:hidden}
.pack summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:12px 14px}
.pack summary::-webkit-details-marker{display:none}
.pack .code{font-family:var(--f-display);font-weight:800;font-size:20px;width:48px;height:48px;border-radius:10px;display:grid;place-items:center;background:var(--paper);border:1.5px solid var(--rule)}
.pack.done{border-color:var(--leaf)}
.pack.done .code{background:var(--leaf);color:#fff;border-color:var(--leaf)}
.pack.locked{opacity:.6}
.pack .meta{font-size:14px;color:var(--ink-soft)}
.pill{font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill.open{background:var(--carrot-soft);color:var(--carrot)}
.pill.done{background:var(--leaf-soft);color:var(--leaf)}
.pill.locked{background:var(--paper);color:var(--ink-soft);border:1px solid var(--rule)}
.pack .body{padding:0 16px 16px 16px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--rule);padding-top:14px}
.checks{display:flex;flex-direction:column;gap:8px}
.checks label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.checks input{width:20px;height:20px;accent-color:var(--leaf);margin-top:3px;flex:0 0 auto}
.progress{height:12px;border-radius:999px;background:var(--rule);overflow:hidden}
.progress i{display:block;height:100%;background:var(--leaf);border-radius:999px;transition:width .3s}
.wahl{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px}
.wahl button{font:inherit;text-align:left;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:12px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.wahl button[aria-pressed="true"]{border-color:var(--carrot);background:var(--carrot-soft)}
.wahl button b{font-family:var(--f-display)}
.wahl button span{font-size:14px;color:var(--ink-soft)}

/* Bericht */
table.rep{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
table.rep th,table.rep td{border-bottom:1px solid var(--rule);text-align:left;padding:8px 6px;vertical-align:top}
.tablewrap{overflow-x:auto}
.amp{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:6px}
.codebox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;word-break:break-all;min-height:90px}
@media (prefers-reduced-motion: reduce){.progress i{transition:none}}

/* Leitfragen-Werkstatt */
.crit{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px}
.crit div{border:1px solid var(--rule);border-radius:12px;padding:12px;background:var(--paper);display:flex;flex-direction:column;gap:4px}
.crit b{font-family:var(--f-display);font-size:18px}
.crit span{font-size:15px;color:var(--ink-soft)}
.prac{display:flex;flex-direction:column;gap:10px}
.prac .item{border:1px solid var(--rule);border-radius:12px;padding:12px 14px;background:var(--paper);display:flex;flex-direction:column;gap:8px}
.prac .item q{font-weight:700;quotes:"„" "“"}
.prac .item .fb{font-size:15px}
.stepno{font-family:var(--f-display);font-weight:800;color:var(--carrot);font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.warn{color:var(--berry);font-size:15px}
.ops summary{cursor:pointer;line-height:1.5}
.ops dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:8px 16px;margin:12px 0 0}
.ops dl div{display:flex;flex-direction:column;gap:2px}
.ops dt{font-weight:700}
.ops dd{margin:0;font-size:15px;color:var(--ink-soft)}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="eyebrow">Freiarbeit Biologie · Klasse 7</span>
    <h1>Mission Teller 2050</h1>
    <p class="who" id="who"></p>
  </header>
  <nav class="stations" id="nav" aria-label="Stationen"></nav>
  <main id="view"></main>
</div>

<script>
(function(){
"use strict";
const KEY="teller2050.v1";
const blank=()=>({name:"",members:"",rahmen:false,film:false,questions:[],prac:{},group:[],ober:"",leit:"",selfcheck:[false,false,false,false],leitDone:false,compare:"",prog1:"",pre:null,wahl:"",wahl2:"",pk:{}});
let S=blank();
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(blank(),JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
const today=()=>new Date().toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"});

/* ---------- Inhalte ---------- */
const BAUSTEINE={
  P1:"P1 Warum essen wir? (Nährstoffe)",P2:"P2 Was passiert mit dem Essen? (Verdauung)",
  W1:"W1 Esskulturen weltweit",W2:"W2 Werbung und Ernährung",W3:"W3 Wenn Essen krank macht",W4:"W4 Nachhaltig essen",X:"Passt zu keinem Baustein"
};
const WAHL=[
  {id:"W1",t:"Esskulturen",q:"Wie essen andere Volksgruppen?",z:"Welche Esskulturen könnten Vorbild für die Zukunft sein?"},
  {id:"W2",t:"Werbung",q:"Wie verändert Werbung unsere Ernährung?",z:"Wer bestimmt, was wir morgen essen?"},
  {id:"W3",t:"Wenn Essen krank macht",q:"Allergien, Unverträglichkeiten, Fehlernährung",z:"Wie kann Ernährung für alle gesund werden?"},
  {id:"W4",t:"Nachhaltig essen",q:"Wie essen wir, ohne der Erde zu schaden?",z:"Wie ernähren wir fast 10 Milliarden Menschen?"}
];
const PACKS=[
  {id:"1a",bs:"P1",t:"Nährstoffe und ihre Aufgaben",box:"Box P1",need:["0"],todo:["**Nenne** die drei Grundnährstoffe und vier weitere Bestandteile der Nahrung. Nutze dazu die Seiten zu den Nährstoffen im bioskop.", "**Beschreibe** für jeden Grundnährstoff in einem Steckbrief, in welchen Lebensmitteln er vorkommt und welche Aufgabe er im Körper hat.", "**Ordne** die Nährstoffe den Gruppen Baustoff, Betriebsstoff (Energie) sowie Schutz- und Reglerstoff **zu** und **begründe** jede Zuordnung."]},
  {id:"1b",bs:"P1",t:"Nährstoffe nachweisen",box:"Versuchsbox P1",need:["1a"],todo:["**Führe** die Fettfleckprobe nach Anleitung mit drei Lebensmitteln **durch** und **protokolliere** deine Beobachtungen.", "**Führe** den Test mit Zucker-Teststreifen an Saft, Wasser und Zuckerlösung **durch** und **werte** die Ergebnisse **aus**.", "**Beschreibe** die Beobachtungen im Video zum Stärkenachweis mit Iod (QR-Code) und **deute** sie.", "**Vergleiche** mithilfe der Nährwertangaben auf zwei Verpackungen aus der Box den Gehalt an Zucker, Fett und Eiweiß."]},
  {id:"2a",bs:"P2",t:"Der Weg der Nahrung",box:"Box P2",need:["1a"],todo:["**Ordne** die Organkarten in der Reihenfolge, in der die Nahrung sie durchläuft.", "**Ordne** jedem Organ die passende Funktionskarte **zu**.", "**Zeichne** den Verdauungstrakt vereinfacht in deine Mappe und **beschreibe** daneben den Weg der Nahrung vom Mund bis zum Dickdarm.", "**Ermittle** mit der Schnur die ungefähre Länge deines Verdauungstrakts und **vergleiche** sie mit deiner Körpergröße."]},
  {id:"2b",bs:"P2",t:"Verdauung im Modell",box:"Versuchsbox P2",need:["2a"],todo:["**Führe** den Modellversuch zum Magen mit Zwieback und Wasser im Gefrierbeutel **durch** und **beschreibe** deine Beobachtung.", "**Erkläre**, welche Aufgabe des Magens das Modell zeigt.", "**Vergleiche** im Modellversuch glattes und gefaltetes Papier gleicher Länge: Welches hat die größere Fläche?", "**Erkläre** mithilfe des Modells, warum der Dünndarm innen stark gefaltet ist. **Nenne** einen Unterschied zwischen Modell und echtem Dünndarm."]},
  {id:"Wa",bs:"W",t:"Wahlbaustein: Recherche",box:"Box zu deinem Wahlbaustein",need:["1b","2b"],todo:["**Nenne** die Leitfrage deines Wahlbausteins (Leitfragen-Karte) und **entwickle** zwei eigene Teilfragen dazu.", "**Ermittle** mit dem Material der Box und den Seiten der QR-Codes Antworten auf deine Teilfragen.", "**Fasse** deine wichtigsten Ergebnisse mit Quellenangaben **zusammen**."]},
  {id:"Wb",bs:"W",t:"Wahlbaustein: Ergebnis zeigen",box:"Box zu deinem Wahlbaustein",need:["Wa"],todo:["**Stelle** dein Ergebnis in deiner Mappe übersichtlich **dar**: Text, Skizze und Quellen.", "**Entwickle** ein Ausstellungsstück: Plakat, Infokarte oder ein Mitmach-Element.", "**Beurteile**, was dein Thema für die Ernährung im Jahr 2050 bedeutet, und **begründe** dein Urteil mit zwei Argumenten."]}
];
const OPERATOREN=[
  ["nennen","Elemente, Fakten oder Begriffe ohne Erklärung aufzählen."],
  ["beschreiben","Strukturen oder Abläufe in eigenen Worten und mit Fachbegriffen genau wiedergeben."],
  ["ordnen, zuordnen","Dinge nach einem Merkmal sortieren oder einander passend zuweisen."],
  ["vergleichen","Gemeinsamkeiten und Unterschiede herausfinden."],
  ["durchführen","Einen Versuch nach Anleitung oder Plan ausführen."],
  ["protokollieren","Ablauf und Beobachtungen eines Versuchs genau aufschreiben oder zeichnen."],
  ["auswerten","Ergebnisse miteinander in Beziehung setzen und daraus eine Aussage ableiten."],
  ["deuten","Eine Beobachtung erklären und in einen Zusammenhang einordnen."],
  ["zeichnen","Eine genaue und übersichtliche Darstellung von Strukturen anfertigen."],
  ["ermitteln","Ein Ergebnis oder einen Zusammenhang herausfinden und angeben."],
  ["erklären","Einen Sachverhalt nachvollziehbar machen, indem man Ursachen und Regeln nennt."],
  ["begründen","Eine Aussage mit Argumenten, Regeln oder Ursachen stützen."],
  ["prüfen","Aussagen an Fakten oder Merkmalen messen und Widersprüche aufdecken."],
  ["entwickeln","Ideen schrittweise zu einer Frage, einem Modell oder einem Produkt ausbauen."],
  ["zusammenfassen","Das Wesentliche kurz und in eigenen Worten wiedergeben."],
  ["darstellen","Sachverhalte strukturiert und mit Fachsprache aufzeigen."],
  ["Hypothese aufstellen","Eine begründete Vermutung formulieren."],
  ["beurteilen","Mit Fachwissen ein eigenes Urteil bilden und begründen."]
];
const CHECKS=["Ich habe alle Aufgaben bearbeitet.","Ich habe meine Ergebnisse in meiner Mappe gesichert.","Ich habe ins Lerntagebuch geschrieben, was ich gelernt habe und was noch offen ist."];

const QUIZ=[
  {q:"Welcher Nährstoff liefert pro Gramm am meisten Energie?",o:["Kohlenhydrate","Fett","Eiweiß","Vitamine"],a:1,bs:"P1"},
  {q:"Welcher Nährstoff ist vor allem ein Baustoff, zum Beispiel für Muskeln?",o:["Eiweiß","Zucker","Ballaststoffe","Wasser"],a:0,bs:"P1"},
  {q:"Du gibst Iodlösung auf eine Kartoffelscheibe. Sie färbt sich blauschwarz. Was weist du nach?",o:["Fett","Traubenzucker","Stärke","Eiweiß"],a:2,bs:"P1"},
  {q:"Was passiert im Magen?",o:["Die Nahrung wird gekaut.","Die Nahrung wird mit Magensaft durchmischt.","Die Nährstoffe gelangen ins Blut.","Der Nahrung wird Wasser entzogen."],a:1,bs:"P2"},
  {q:"Wo werden die meisten Nährstoffe ins Blut aufgenommen?",o:["in der Speiseröhre","im Magen","im Dünndarm","im Dickdarm"],a:2,bs:"P2"},
  {q:"Warum ist die Innenwand des Dünndarms mit Darmzotten gefaltet?",o:["damit die Nahrung schneller rutscht","damit die Oberfläche größer wird","damit der Darm kürzer sein kann","damit keine Bakterien hineinkommen"],a:1,bs:"P2"},
  {q:"Welches Organ gehört nicht zum Verdauungstrakt?",o:["Speiseröhre","Magen","Lunge","Dünndarm"],a:2,bs:"P2"},
  {q:"Welches Lebensmittel verursacht pro Kilogramm meist die meisten Treibhausgase?",o:["Kartoffeln","Äpfel","Linsen","Rindfleisch"],a:3,bs:"W"}
];

/* ---------- Navigation ---------- */
function allPacksDone(){return PACKS.every(p=>isDone(p.id));}
const STEPS=[
  {id:"start",t:"Start",done:()=>!!S.name&&S.rahmen},
  {id:"film",t:"Film",done:()=>S.film},
  {id:"fragen",t:"Fragen",done:()=>S.questions.length>=3&&S.questions.every(q=>q.cat)},
  {id:"leitfrage",t:"Leitfrage",done:()=>S.leitDone&&S.prog1.trim().length>15},
  {id:"vortest",t:"Vortest",done:()=>!!S.pre},
  {id:"laufzettel",t:"Laufzettel",done:()=>allPacksDone()},
  {id:"bericht",t:"Bericht",done:()=>false}
];
let cur="start";
try{const h=location.hash.slice(1);if(STEPS.some(s=>s.id===h))cur=h;}catch(e){}
function go(id){stopFilm();cur=id;try{history.replaceState(null,"","#"+id);}catch(e){}render();window.scrollTo({top:0});}
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(STEPS.some(s=>s.id===h)&&h!==cur){cur=h;stopFilm();render();}});
function paket0Done(){return STEPS.slice(0,5).every(s=>s.done());}

function renderNav(){
  $("#nav").innerHTML=STEPS.map(s=>`<button type="button" data-go="${s.id}" ${s.id===cur?'aria-current="step"':""} class="${s.done()?"done":""}"><span class="tick" aria-hidden="true">${s.done()?"✓":""}</span>${s.t}</button>`).join("");
  $("#who").textContent=S.name?("Laufzettel von "+S.name+(S.members?" · "+S.members:"")):"Noch kein Name eingetragen";
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-go]");if(b){e.preventDefault();go(b.dataset.go);}});

 <section class="sheet stack">
  <h2>Willkommen zur Freiarbeit Ernährung</h2>

  <div class="grid2">
   <label class="field" for="f-name">Dein Name oder Kürzel<input type="text" id="f-name" value="${esc(S.name)}" autocomplete="off" maxlength="40" placeholder="z. B. Lena K."></label>
   <label class="field" for="f-members">Partner oder Gruppe <span class="hint">freiwillig, nur Vornamen oder Kürzel</span><input type="text" id="f-members" value="${esc(S.members)}" autocomplete="off" maxlength="80" placeholder="z. B. mit Tom und Ali"></label>
  </div>
 </section>
 <section class="sheet stack" aria-labelledby="rahmen-h">
  <h2 id="rahmen-h">So läuft die Freiarbeit</h2>
  <div class="grid2">
   <div class="fact"><span class="eyebrow">Zeitraum</span><b>4 Wochen</b><span>je 2 Biologiestunden pro Woche, also 8 Stunden</span></div>
   <div class="fact"><span class="eyebrow">Pensum</span><b>7 Pakete</b><span>Start, 4 Pflichtpakete und 2 Wahlpakete. Ein Paket dauert etwa 45 Minuten.</span></div>
   <div class="fact"><span class="eyebrow">Fächerwahl</span><b>Biologie, Kunst, Englisch</b><span>Alle drei Fächer bieten gleichzeitig Freiarbeit an. Du entscheidest jede Stunde, woran du arbeitest.</span></div>
   <div class="fact"><span class="eyebrow">Ende</span><b>Lernzielkontrolle</b><span>Am Ende der vier Wochen schreibst du eine Lernzielkontrolle.</span></div>
  </div>
  <h3>Wichtig, weil keine Biologielehrkraft im Raum ist</h3>
  <ul class="clean">
   <li>Plane selbst: Bis zum Ende der 4 Wochen müssen alle Biologie-Pakete erledigt sein. Wenn du Kunst oder Englisch wählst, musst du Biologie später nachholen.</li>
   <li>Alles, was du brauchst, liegt in den beschrifteten Boxen im Biologie-Regal. Nimm immer nur eine Box und bringe sie vollständig zurück.</li>
   <li>Wenn du nicht weiterkommst: Jedes Modul hat eigene Hilfen in seiner Box. Nutze sie, bevor du andere fragst.</li>
   <li>Bleibt eine Frage offen, schreibe sie in dein Lerntagebuch und arbeite am nächsten Teil weiter. Deine offenen Fragen stehen später in deinem Bericht für die Biologielehrkraft.</li>
   <li>Versuche nur mit dem Material aus der Versuchsbox und genau nach Anleitung. Nichts probieren oder essen, außer die Anleitung erlaubt es ausdrücklich.</li>
   <li>Die Aufsicht hilft bei Boxen und Ordnung, aber nicht beim Fachinhalt.</li>
  </ul>
  <h3>So wird bewertet</h3>
  <p>Deine Arbeit in der Freiarbeit zählt mit <b>20 % zu deiner mündlichen Note</b>.</p>
  <div class="note"><b>Dein Fortschritt wird nur auf diesem Gerät gespeichert.</b> Wenn du an einem anderen Tablet weiterarbeitest, nimm deinen Fortschrittscode mit (unter „Bericht“).</div>
  <div class="checks"><label for="f-rahmen"><input type="checkbox" id="f-rahmen" ${S.rahmen?"checked":""}> Ich habe die Regeln gelesen und verstanden.</label></div>
  <div class="row"><button class="btn" type="button" id="b-start" ${S.name&&S.rahmen?"":"disabled"}>Weiter zum Film</button></div>
 </section>
</div>`;
V.start.after=()=>{
  const upd=()=>{S.name=$("#f-name").value.trim();S.members=$("#f-members").value.trim();S.rahmen=$("#f-rahmen").checked;save();renderNav();$("#b-start").disabled=!(S.name&&S.rahmen);};

/* Musik: eine kleine, selbst erzeugte Melodie (Web Audio), startet erst nach Klick auf Abspielen */
const MEL=[[72,null,76,79,76,null,74,72],[69,null,72,76,74,72,69,null],[65,69,72,null,74,72,69,null],[67,71,74,null,79,77,74,71]];
const BASS=[48,45,41,43];
const Music={ctx:null,out:null,noise:null,timer:null,step:0,next:0,
  start(){
    try{
      if(!this.ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;this.ctx=new AC();this.out=this.ctx.createGain();this.out.gain.value=.14;this.out.connect(this.ctx.destination);
        const len=this.ctx.sampleRate*.05,buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);this.noise=buf;}
      this.ctx.resume();this.next=this.ctx.currentTime+.06;clearInterval(this.timer);this.timer=setInterval(()=>this.sched(),50);
    }catch(e){}
  },
  stop(){clearInterval(this.timer);this.timer=null;},
  sched(){const c=this.ctx,dur=60/116/2;while(this.next<c.currentTime+.2){this.play(this.step,this.next);this.next+=dur;this.step=(this.step+1)%32;}},
  tone(m,t,len,type,vol){const c=this.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=440*Math.pow(2,(m-69)/12);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.001,t+len);o.connect(g);g.connect(this.out);o.start(t);o.stop(t+len+.05);},
  hat(t){const c=this.ctx,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=this.noise;f.type="highpass";f.frequency.value=6000;g.gain.value=.25;s.connect(f);f.connect(g);g.connect(this.out);s.start(t);},
  play(i,t){const bar=i>>3,k=i&7,m=MEL[bar][k];if(m)this.tone(m,t,.24,"triangle",.55);if(k%4===0)this.tone(BASS[bar],t,.5,"sine",.7);if(k%2===1)this.hat(t);}
};

function drawFilm(){
  const st=$("#stage");if(!st)return;
  const sc=SCENES[film.scene];
  st.innerHTML=DEFS+sc.draw(film.frame);
  const cap=$("#cap");if(cap.dataset.s!==String(film.scene)){cap.textContent=sc.cap;cap.dataset.s=String(film.scene);}
  $("#dots").innerHTML=SCENES.map((_,i)=>`<span class="${i===film.scene?"on":""}"></span>`).join("");
}
function speak(){try{if(!$("#f-voice")||!$("#f-voice").checked||!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(SCENES[film.scene].cap);u.lang="de-DE";u.rate=.95;speechSynthesis.speak(u);}catch(e){}}
function tick(){
  film.frame++;
  if(film.frame>=SCENES[film.scene].len){
    if(film.scene<SCENES.length-1){film.scene++;film.frame=0;speak();}
    else{film.frame=SCENES[film.scene].len-1;pauseFilm();markFilm();return;}
  }
  drawFilm();
}
function markFilm(){if(!S.film){S.film=true;save();renderNav();}const b=$("#b-film");if(b){b.disabled=false;$("#film-hint").textContent="";}}
function playFilm(){
  if(film.scene===SCENES.length-1&&film.frame>=SCENES[film.scene].len-1){film.scene=0;film.frame=0;}
  else if(film.frame>=SCENES[film.scene].len-1)film.frame=0;
  film.playing=true;$("#f-play").textContent="❚❚ Pause";speak();
  if($("#f-music").checked)Music.start();
  const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  film.timer=setInterval(tick,reduce?1000/3:1000/FPS);
}
function pauseFilm(){film.playing=false;clearInterval(film.timer);film.timer=null;Music.stop();const b=$("#f-play");if(b)b.textContent="▶ Abspielen";}
function stopFilm(){pauseFilm();try{window.speechSynthesis&&speechSynthesis.cancel();}catch(e){}}
function jump(d){
  film.scene=Math.max(0,Math.min(SCENES.length-1,film.scene+d));
  film.frame=film.playing?0:SCENES[film.scene].len-1;
  if(film.scene===SCENES.length-1&&!film.playing)markFilm();
  drawFilm();speak();
}
V.film.after=()=>{
  if(!film.playing)film.frame=SCENES[film.scene].len-1;
  drawFilm();
  $("#f-play").addEventListener("click",()=>film.playing?pauseFilm():playFilm());
  $("#f-prev").addEventListener("click",()=>jump(-1));
  $("#f-next").addEventListener("click",()=>jump(1));
  $("#f-music").addEventListener("change",e=>{if(!film.playing)return;e.target.checked?Music.start():Music.stop();});
  $("#b-film").addEventListener("click",()=>go("fragen"));
};

/* ---------- Fragen ---------- */
V.fragen=()=>{
  const opts=q=>`<option value="">Zu welchem Baustein passt das?</option>`+Object.entries(BAUSTEINE).map(([k,v])=>`<option value="${k}" ${q.cat===k?"selected":""}>${esc(v)}</option>`).join("");
  return `<div class="stack"><section class="sheet stack">
  <h2>Meine Fragen</h2>
  <p>Welche Fragen sind dir beim Film eingefallen? <b>Notiere</b> mindestens 3 eigene Fragen. <b>Ordne</b> danach jede Frage einem Baustein <b>zu</b>.</p>
  <div class="note green">Ein Beispiel: Warum wurde früher mehr auf dem Feld gearbeitet als heute?</div>
  <form id="q-form" class="row" autocomplete="off"><label class="field" for="q-in" style="flex:1 1 280px">Neue Frage<input type="text" id="q-in" maxlength="160" placeholder="Schreibe deine Frage hier"></label><button class="btn" type="submit" style="align-self:flex-end">Hinzufügen</button></form>
  ${S.questions.length?`<ul class="qlist">${S.questions.map((q,i)=>`<li><p>${esc(q.t)}</p><select data-i="${i}" aria-label="Baustein für Frage ${i+1}">${opts(q)}</select><button class="x" type="button" data-del="${i}" aria-label="Frage löschen">×</button></li>`).join("")}</ul>`:`<p style="color:var(--ink-soft)">Noch keine Fragen. Deine erste Frage erscheint hier.</p>`}
  ${summaryCats()}
  <div class="row"><button class="btn" type="button" id="b-fragen" ${STEPS[2].done()?"":"disabled"}>Weiter zur Leitfrage</button><span style="color:var(--ink-soft);font-size:15px">${STEPS[2].done()?"":"Mindestens 3 Fragen, jede einem Baustein zugeordnet."}</span></div>
  </section></div>`;
};
function summaryCats(){
  const c={};S.questions.forEach(q=>{if(q.cat&&q.cat[0]==="W")c[q.cat]=(c[q.cat]||0)+1;});
  const best=Object.entries(c).sort((a,b)=>b[1]-a[1])[0];
  return best?`<div class="note">Die meisten deiner Fragen passen zu <b>${esc(BAUSTEINE[best[0]])}</b>. Das könnte ein guter Wahlbaustein für dich sein.</div>`:"";
}
V.fragen.after=()=>{
  $("#q-form").addEventListener("submit",e=>{e.preventDefault();const v=$("#q-in").value.trim();if(!v)return;S.questions.push({t:v,cat:""});save();render();setTimeout(()=>{const i=$("#q-in");if(i)i.focus();},0);});
  document.querySelectorAll(".qlist select").forEach(sel=>sel.addEventListener("change",()=>{S.questions[+sel.dataset.i].cat=sel.value;save();render();}));
  document.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",()=>{const i=+b.dataset.del;S.questions.splice(i,1);S.group=S.group.filter(g=>g!==i).map(g=>g>i?g-1:g);save();render();}));
  $("#b-fragen").addEventListener("click",()=>go("leitfrage"));
};

/* ---------- Leitfrage ---------- */
const CRIT=[
  {t:"Offen",d:"Man kann sie nicht mit Ja oder Nein beantworten."},
  {t:"Groß",d:"Ein Satz oder eine Zahl aus dem Buch reicht als Antwort nicht aus."},
  {t:"Verbindend",d:"Viele kleine Fragen aus verschiedenen Bereichen helfen, sie zu beantworten."},
  {t:"Untersuchbar",d:"Man kann mit Recherche, Versuchen und Nachdenken begründete Antworten finden."}
];
const PRAC=[
  {q:"Was ist Stärke?",ok:false,r:"eng",fb:"Das steht mit einem Satz im Buch. Es ist eine gute Teilfrage, aber keine Leitfrage."},
  {q:"Ist Fast Food ungesund?",ok:false,r:"jn",fb:"Darauf kann man mit Ja oder Nein antworten. Besser wäre: Wie wirkt sich Fast Food auf unseren Körper aus?"},
  {q:"Wie beeinflusst unsere Ernährung unsere Gesundheit und unsere Umwelt?",ok:true,fb:"Offen, groß und verbindend: Nährstoffe, Verdauung, Krankheiten und Nachhaltigkeit helfen bei der Antwort."},
  {q:"Welches Essen schmeckt am besten?",ok:false,r:"nicht",fb:"Das ist Geschmackssache. Man kann es nicht mit Fakten untersuchen."},
  {q:"Wie viele Meter ist der Dünndarm lang?",ok:false,r:"eng",fb:"Die Antwort ist eine Zahl. Gut als Teilfrage für P2."}
];
const REASONS={jn:"Ja-Nein-Frage",eng:"zu eng",nicht:"nicht untersuchbar"};
const STARTS=["Wie wird sich …","Welche Folgen hat …","Wie können wir …","Warum verändert sich …"];
const JN=/^(ist|sind|kann|können|hat|haben|gibt|soll|sollte|sollten|muss|müssen|darf|dürfen|wird|werden|war|waren|isst|essen|macht|brauchen|braucht)\b/i;
function pracDone(){return PRAC.every((p,i)=>{const a=S.prac[i];return a&&a.ok===p.ok&&(p.ok||a.r===p.r);});}
function leitWarn(){const t=S.leit.trim();const w=[];if(!t)return w;if(JN.test(t))w.push("Deine Frage beginnt wie eine Ja-Nein-Frage. Versuche es mit einem Fragewort wie Wie, Warum oder Welche.");if(t.split(/\s+/).length<7)w.push("Deine Frage ist sehr kurz. Ist sie groß genug für alle Bausteine?");if(!/\?\s*$/.test(t))w.push("Vergiss das Fragezeichen nicht.");return w;}
function leitReady(){return pracDone()&&(S.questions.length<3||S.group.length>=2)&&S.ober.trim().length>2&&S.leit.trim().length>10&&!leitWarn().length&&S.selfcheck.every(Boolean);}
V.leitfrage=()=>{
  const pd=pracDone();
  return `<div class="stack"><section class="sheet stack">
  <h2>Die Leitfrage entwickeln</h2>
  <p>Eine Leitfrage ist die große Frage, die über allen Stationen steht. Alle kleinen Fragen helfen, sie zu beantworten. In vier Schritten entwickelst du deine eigene Leitfrage.</p>
  <span class="stepno">Schritt 1 · Was eine gute Leitfrage ausmacht</span>
  <div class="crit">${CRIT.map(c=>`<div><b>${c.t}</b><span>${c.d}</span></div>`).join("")}</div>
 </section>
 <section class="sheet stack">
  <span class="stepno">Schritt 2 · Fragen prüfen</span>
  <p><b>Prüfe</b> mit den vier Merkmalen, ob es sich um eine gute Leitfrage handelt. Wenn nicht: <b>Nenne</b> das Problem.</p>
  <div class="prac">${PRAC.map((p,i)=>{const a=S.prac[i]||{};const right=a.ok!==undefined&&a.ok===p.ok&&(p.ok||a.r===p.r);const wrong=a.ok!==undefined&&!right&&(a.ok===true||a.r);
   return `<div class="item"><q>${esc(p.q)}</q>
    <div class="chips"><button type="button" class="chip" data-pi="${i}" data-ok="1" aria-pressed="${a.ok===true}">gute Leitfrage</button><button type="button" class="chip" data-pi="${i}" data-ok="0" aria-pressed="${a.ok===false}">keine Leitfrage</button></div>
    ${a.ok===false?`<div class="chips">${Object.entries(REASONS).map(([k,l])=>`<button type="button" class="chip" data-pi="${i}" data-r="${k}" aria-pressed="${a.r===k}">${l}</button>`).join("")}</div>`:""}
    ${right?`<p class="fb"><span class="ok">Richtig.</span> ${esc(p.fb)}</p>`:wrong?`<p class="fb"><span class="no">Noch nicht.</span> Prüfe die Frage noch einmal mit den vier Merkmalen.</p>`:""}</div>`;}).join("")}</div>
 </section>
 <section class="sheet stack" ${pd?"":'aria-disabled="true" style="opacity:.55"'}>
  <span class="stepno">Schritt 3 · Deine Fragen bündeln</span>
  ${pd?`<p><b>Vergleiche</b> deine eigenen Fragen und wähle mindestens zwei aus, die zusammengehören. <b>Nenne</b> in einem Begriff oder Satz, was sie gemeinsam haben.</p>

  <label class="field" for="ober">Das Gemeinsame in einem Begriff oder Satz <span class="hint">z. B. „Wie sich Essen und Landwirtschaft verändern“</span><input type="text" id="ober" maxlength="120" value="${esc(S.ober)}"></label>`:`<p>Wird frei, wenn du in Schritt 2 alle Fragen richtig geprüft hast.</p>`}
 </section>
 <section class="sheet stack" ${pd?"":'aria-disabled="true" style="opacity:.55"'}>
  <span class="stepno">Schritt 4 · Deine Leitfrage formulieren</span>
  ${pd?`<p><b>Entwickle</b> aus dem Gemeinsamen eine Leitfrage, die zur Zukunft der Ernährung passt, und <b>prüfe</b> sie anschließend mit den vier Merkmalen. Diese Satzanfänge können helfen:</p>

/* PDF ohne Zusatzbibliothek: kleiner Schreiber mit Helvetica (WinAnsi, kann Umlaute) */
const HW=[278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
const WIN={0x2013:0x96,0x2014:0x97,0x2022:0x95,0x2026:0x85,0x201E:0x84,0x201C:0x93,0x201D:0x94,0x2018:0x91,0x2019:0x92,0x201A:0x82,0x20AC:0x80};
const XW={0x96:556,0x97:1000,0x95:350,0x85:1000,0x84:333,0x93:333,0x94:333,0x91:222,0x92:222,0x82:222,0x80:556,0xB7:278,0xDF:611,0xC4:667,0xD6:778,0xDC:722,0xE4:556,0xF6:556,0xFC:556,0xA0:278};
function winByte(ch){const c=ch.codePointAt(0);if(c>=32&&c<127)return c;if(WIN[c])return WIN[c];if(c>=160&&c<256)return c;if(c===9)return 32;return 63;}
class MiniPdf{
  constructor(){this.pages=[[]];this.font="F1";this.size=11;}
  addPage(){this.pages.push([]);}
  setFont(_f,style){this.font=style==="bold"?"F2":"F1";}
  setFontSize(s){this.size=s;}
  width(t){let w=0;for(const ch of String(t)){const b=winByte(ch);w+=b<127?HW[b-32]:(XW[b]||556);}return w*(this.font==="F2"?1.1:1)*this.size/1000*25.4/72;}
  splitTextToSize(t,max){
    const out=[];
    String(t).split(/\r?\n/).forEach(par=>{
      let line="";
      par.split(/ +/).forEach(word=>{
        while(this.width(word)>max){let i=word.length-1;while(i>1&&this.width(word.slice(0,i))>max)i--;if(line){out.push(line);line="";}out.push(word.slice(0,i));word=word.slice(i);}
        const test=line?line+" "+word:word;
        if(this.width(test)>max&&line){out.push(line);line=word;}else line=test;
      });
      out.push(line);
    });
    return out;
  }
  text(t,x,y){
    let s="";for(const ch of String(t)){const b=winByte(ch);const c=String.fromCharCode(b);s+=(c==="("||c===")"||c==="\\")?"\\"+c:c;}
    const k=72/25.4;
    this.pages[this.pages.length-1].push("BT /"+this.font+" "+this.size+" Tf "+(x*k).toFixed(2)+" "+(841.89-y*k).toFixed(2)+" Td ("+s+") Tj ET");
  }
  output(){
    const objs=[];const add=o=>{objs.push(o);return objs.length;};
    const cat=add(""),pagesId=add("");
    const f1=add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
    const f2=add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");
    const kids=[];
    this.pages.forEach(p=>{
      const body=p.join("\n");
      const cs=add("<< /Length "+body.length+" >>\nstream\n"+body+"\nendstream");
      kids.push(add("<< /Type /Page /Parent "+pagesId+" 0 R /MediaBox [0 0 595.28 841.89] /Resources << /Font << /F1 "+f1+" 0 R /F2 "+f2+" 0 R >> >> /Contents "+cs+" 0 R >>"));
    });
    objs[cat-1]="<< /Type /Catalog /Pages "+pagesId+" 0 R >>";
    objs[pagesId-1]="<< /Type /Pages /Kids ["+kids.map(k=>k+" 0 R").join(" ")+"] /Count "+kids.length+" >>";
    let pdf="%PDF-1.4\n%\xE2\xE3\xCF\xD3\n";const offs=[];
    objs.forEach((o,i)=>{offs.push(pdf.length);pdf+=(i+1)+" 0 obj\n"+o+"\nendobj\n";});
    const xref=pdf.length;
    pdf+="xref\n0 "+(objs.length+1)+"\n0000000000 65535 f \n"+offs.map(o=>String(o).padStart(10,"0")+" 00000 n \n").join("");
    pdf+="trailer\n<< /Size "+(objs.length+1)+" /Root "+cat+" 0 R >>\nstartxref\n"+xref+"\n%%EOF";
    const bytes=new Uint8Array(pdf.length);for(let i=0;i<pdf.length;i++)bytes[i]=pdf.charCodeAt(i)&255;
    return new Blob([bytes],{type:"application/pdf"});
  }
}
function buildPdf(){
  const doc=new MiniPdf();
  const L=18,W=174;let y=20;
  const need=h=>{if(y+h>282){doc.addPage();y=20;}};
  const head=(t,size=13)=>{need(12);doc.setFont("helvetica","bold");doc.setFontSize(size);doc.text(t,L,y);y+=size*.5+2;};
  const para=(t,size=11)=>{doc.setFont("helvetica","normal");doc.setFontSize(size);doc.splitTextToSize(String(t||"–"),W).forEach(line=>{need(6);doc.text(line,L,y);y+=size*.45+1;});y+=2;};
  const pair=(k,v)=>{doc.setFontSize(11);doc.setFont("helvetica","bold");need(6);doc.text(k,L,y);doc.setFont("helvetica","normal");const lines=doc.splitTextToSize(String(v||"–"),W-46);lines.forEach((ln,i)=>{if(i)need(6);doc.text(ln,L+46,y);y+=6;});};
  doc.setFont("helvetica","bold");doc.setFontSize(20);doc.text("Mission Teller 2050",L,y);y+=8;
  doc.setFont("helvetica","normal");doc.setFontSize(11);doc.text("Bericht zur Freiarbeit Biologie · Ernährung · erstellt am "+new Date().toLocaleDateString("de-DE"),L,y);y+=10;
  const w=WAHL.find(x=>x.id===S.wahl);
  pair("Name",S.name+(S.members?" ("+S.members+")":""));
  pair("Wahlbaustein",w?w.id+" "+w.t+(S.wahl2?" · Expertenauftrag "+S.wahl2:""):"noch nicht gewählt");
  pair("Vortest",S.pre?S.pre.score+" von "+QUIZ.length+" richtig ("+S.pre.at+")":"noch nicht gemacht");
  y+=4;head("Pakete");
  [{id:"0",t:"Start: Film, Fragen, Leitfrage, Vortest"}].concat(PACKS).forEach(p=>{const d=S.pk[p.id];pair(p.id,p.t+": "+(isDone(p.id)?"erledigt"+(d&&d.done?" am "+d.done:""):"offen"));});
  y+=4;head("Meine Fragen");
  if(S.questions.length)S.questions.forEach(q=>para("• "+q.t+(q.cat?"  ("+BAUSTEINE[q.cat]+")":"")));else para("–");
  head("Meine Leitfrage");para(S.leit);
  head("Gemeinsamkeit meiner Fragen");para(S.ober);
  head("Vergleich mit der Leitfrage der Freiarbeit");para(S.compare);
  head("Meine Hypothese zu 2050");para(S.prog1);
  head("Lerntagebuch");
  const ds=PACKS.filter(p=>S.pk[p.id]&&S.pk[p.id].diary.trim());
  if(ds.length)ds.forEach(p=>{doc.setFont("helvetica","bold");doc.setFontSize(11);need(6);doc.text(p.id+" "+p.t,L,y);y+=5.5;para(S.pk[p.id].diary.trim());});else para("Noch keine Einträge.");
  return doc;
}
function pdfName(){return "Bericht_Teller2050_"+(S.name||"ohne_Name").replace(/[^A-Za-z0-9ÄÖÜäöüß_-]+/g,"_")+".pdf";}
async function savePdf(){
  const m=$("#pdf-msg");
  try{
    m.textContent="PDF wird erstellt …";
    const blob=buildPdf().output();
    const api=window.claude&&typeof window.claude.use==="function"?window.claude:null;
    if(api){
      const dl=await api.use("downloads");
      if(dl){
        try{await dl.save({filename:pdfName(),data:blob});m.textContent="Gespeichert.";}
        catch(e){m.textContent=e&&e.code==="declined"?"Nicht gespeichert.":"Speichern hat nicht geklappt ("+((e&&(e.code||e.message))||"unbekannt")+").";}
        return;
      }
    }
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download=pdfName();a.rel="noopener";document.body.appendChild(a);a.click();a.remove();
    m.innerHTML='Die PDF wurde erstellt. Falls kein Download startet: <a href="'+url+'" target="_blank" rel="noopener">PDF öffnen</a> und von dort speichern oder teilen.';
  }catch(e){m.textContent="Die PDF konnte nicht erstellt werden ("+((e&&e.message)||e)+").";}
}
async function sharePdf(){
  const m=$("#pdf-msg");
  let file;try{file=new File([buildPdf().output()],pdfName(),{type:"application/pdf"});}catch(e){m.textContent="Die PDF konnte nicht erstellt werden ("+((e&&e.message)||e)+").";return;}
  if(!navigator.canShare||!navigator.canShare({files:[file]})){m.textContent="Verschicken geht auf diesem Gerät nicht. Speichere die PDF und hänge sie an eine Nachricht an.";return;}
  try{await navigator.share({files:[file],title:"Bericht Mission Teller 2050"});}catch(e){if(e&&e.name!=="AbortError")m.textContent="Verschicken hat nicht geklappt. Speichere die PDF stattdessen.";}
}
V.bericht.after=()=>{
  $("#b-pdf").addEventListener("click",savePdf);
  const sh=$("#b-share");if(sh)sh.addEventListener("click",sharePdf);
  $("#b-copy").addEventListener("click",()=>{const t=$("#code-out");const done=()=>$("#copy-msg").textContent="Kopiert.";const fall=()=>{t.select();$("#copy-msg").textContent="Code ist markiert. Kopiere ihn mit Strg+C oder durch langes Tippen.";};
    try{navigator.clipboard.writeText(t.value).then(done,fall);}catch(e){fall();}});
  $("#b-load").addEventListener("click",()=>{const v=$("#code-in").value.trim();const m=$("#load-msg");
    try{const o=JSON.parse(decodeURIComponent(escape(atob(v))));if(typeof o!=="object"||!o||!("questions" in o))throw 0;S=Object.assign(blank(),o);save();render();}
    catch(e){m.className="no";m.textContent="Der Code passt nicht. Kopiere ihn noch einmal vollständig.";}});
  $("#b-reset").addEventListener("click",()=>{$("#b-reset-ok").hidden=false;});
  $("#b-reset-ok").addEventListener("click",()=>{S=blank();save();go("start");});
};

/* ---------- Render ---------- */
function render(){
  renderNav();
  const v=V[cur]||V.start;
  $("#view").innerHTML=v();
  if(v.after)v.after();
}
render();
})();
</script>
